[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egdo"
dynamic = ["version"]
description = "A rolling Markdown work journal for the terminal."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "2miles" }
]
dependencies = ["rich>=14,<15", "rich-argparse>=1.7,<2"]

[project.scripts]
egdo = "egdo.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "egdo.__version__" }
